[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Keyword-rich canonicals: /visa/morocco-evisa, /visa/turkey-evisa, …
# 301 short codes + legacy /en/* paths so ranking signals consolidate.
# ---------------------------------------------------------------------------

# Morocco
[[redirects]]
  from = "/visa/ma"
  to = "/visa/morocco-evisa"
  status = 301

[[redirects]]
  from = "/visa/ma/"
  to = "/visa/morocco-evisa"
  status = 301

[[redirects]]
  from = "/en/morocco-e-visa"
  to = "/visa/morocco-evisa"
  status = 301

[[redirects]]
  from = "/en/morocco-e-visa/"
  to = "/visa/morocco-evisa"
  status = 301

[[redirects]]
  from = "/en-US/morocco-e-visa"
  to = "/visa/morocco-evisa"
  status = 301

[[redirects]]
  from = "/en-US/morocco-e-visa/"
  to = "/visa/morocco-evisa"
  status = 301

